<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ITSM Ticket Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            margin-bottom: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f4f4f4;
        }

        .breached {
            background: #fdecea;
        }

        .badge {
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .badge-breached {
            background: #e74c3c;
            color: white;
        }

        .badge-on_track {
            background: #2ecc71;
            color: white;
        }

        .badge-na {
            background: #bbb;
            color: white;
        }

        #summary {
            color: #555;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <h1>ITSM Ticket Dashboard</h1>
    <div id="summary">Loading tickets...</div>
    <table id="ticket-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>SLA Due</th>
                <th>SLA Status</th>
            </tr>
        </thead>
        <tbody id="ticket-body"></tbody>
    </table>

    <script src="dashboard.js"></script>
</body>

</html>
